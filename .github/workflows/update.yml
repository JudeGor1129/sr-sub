name: Update Subscription

on:
  schedule:
    # 每 6 小时跑一次（UTC 时间）
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "sources.txt"
      - "nodes_base.txt"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-sub
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update nodes
        env:
          CHECK_TIMEOUT: "3"
          CHECK_WORKERS: "64"
          MAX_NODES: "600"
        run: python3 scripts/update.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --quiet --cached; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: update subscription $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
